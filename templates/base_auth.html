{% load static %}<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Sign in{% endblock %} · Oopsware</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body class="flex min-h-full items-center justify-center p-4 text-slate-800 antialiased">
  <div class="w-full max-w-md">
    <div class="mb-6 text-center">
      <span class="mx-auto flex h-12 w-12 items-center justify-center rounded-xl bg-brand-600 text-xl font-bold text-white" aria-hidden="true">O</span>
      <h1 class="mt-3 text-2xl font-semibold">Oopsware</h1>
      <p class="text-sm text-slate-500">Oops less. Get more done.</p>
    </div>
    <div class="card">
      {% include "components/messages.html" %}
      {% block content %}{% endblock %}
    </div>
  </div>
</body>
</html>
