<div id="sidebar-backdrop" class="fixed inset-0 z-30 hidden bg-slate-900/40 lg:hidden" aria-hidden="true"></div>
<aside id="sidebar" class="fixed inset-y-0 left-0 z-40 flex w-64 -translate-x-full transform flex-col border-r border-slate-200 bg-white transition-transform lg:sticky lg:top-0 lg:h-screen lg:shrink-0 lg:translate-x-0" aria-label="Sidebar">
  <div class="flex h-16 items-center gap-3 border-b border-slate-200 px-5">
    <span class="flex h-8 w-8 items-center justify-center rounded-lg bg-brand-600 text-sm font-bold text-white" aria-hidden="true">O</span>
    <div>
      <p class="text-base font-semibold leading-tight">Oopsware</p>
      <p class="text-xs text-slate-500">Oops less. Get more done.</p>
    </div>
  </div>
  <nav class="flex-1 space-y-1 px-3 py-4" aria-label="Main">
    {% for item in nav_items %}
      <a href="{{ item.url }}"
         class="block rounded-lg px-3 py-2 text-sm font-medium {% if item.active %}bg-brand-50 text-brand-700{% else %}text-slate-600 hover:bg-slate-100{% endif %}"
         {% if item.active %}aria-current="page"{% endif %}>{{ item.label }}</a>
    {% endfor %}
  </nav>
  <div class="border-t border-slate-200 p-4">
    <p class="truncate text-sm font-medium">{{ user.full_name }}</p>
    <p class="mb-3 truncate text-xs text-slate-500">{{ user.get_role_display }}</p>
    <form method="post" action="{% url 'logout' %}">
      {% csrf_token %}
      <button type="submit" class="btn-secondary w-full">Sign out</button>
    </form>
  </div>
</aside>
