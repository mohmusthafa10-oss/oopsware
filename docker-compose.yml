services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: oopsware
      POSTGRES_PASSWORD: oopsware
      POSTGRES_DB: oopsware
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oopsware"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: