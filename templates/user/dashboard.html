{% extends "base.html" %}
{% block title %}My dashboard{% endblock %}
{% block content %}
  <h1 class="text-2xl font-semibold">Hello, {{ user.full_name }}</h1>
  <p class="text-sm text-slate-500">{{ today|date:"l, j F Y" }}</p>
  <div class="card mt-6">
    <h2 class="font-semibold">Your workday</h2>
    <p class="mt-1 text-sm text-slate-600">
      Check-in, tasks, to-dos, and daily reports arrive in later phases.
    </p>
  </div>
{% endblock %}
